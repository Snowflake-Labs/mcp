services:
  mcp-server-snowflake:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      platforms:
        - linux/amd64
    image: mcp-server-snowflake:latest
    container_name: mcp-server-snowflake
    environment:
      - SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ACCOUNT}
      - SNOWFLAKE_USER=${SNOWFLAKE_USER}
      - SNOWFLAKE_AUTHENTICATOR=${SNOWFLAKE_AUTHENTICATOR}
      - SNOWFLAKE_ROLE=${SNOWFLAKE_ROLE}
      - SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE}
      - SNOWFLAKE_DATABASE=${SNOWFLAKE_DATABASE}
      - SNOWFLAKE_SCHEMA=${SNOWFLAKE_SCHEMA}
      - SNOWFLAKE_MCP_VERBOSE=${SNOWFLAKE_MCP_VERBOSE}
    volumes:
      - ${HOME}/.mcp/configuration.yaml:/app/services/configuration.yaml:ro
    stdin_open: true
    tty: true
    restart: unless-stopped
